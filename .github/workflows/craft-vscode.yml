name: Build craft-vscode

# hayone/craft-vscode: code-server, Claude Code, Craft Apps, the craft-mcp relay and the five app
# pages in one image (craft-vscode/), for one-click hosts. It only copies files out of the images
# that craft-web.yml builds, so it is rebuilt after each run of that workflow, when one of those
# images (or code-server) changed. Pull requests build and test it without pushing.

on:
  workflow_run:
    workflows: ['Build storytold craft web images']
    types: [completed]
  push:
    branches: [main]
    paths: ['craft-vscode/**', 'craft-mcp/**', '.github/workflows/craft-vscode.yml']
  pull_request:
    paths: ['craft-vscode/**', 'craft-mcp/**', '.github/workflows/craft-vscode.yml']
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if nothing changed'
        required: false
        default: false
        type: boolean
  schedule:
    # code-server and Claude Code releases: once a day.
    - cron: '41 5 * * *'

concurrency:
  group: craft-vscode-${{ github.ref }}
  cancel-in-progress: true

jobs:
  craft-vscode:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: hayone/craft-vscode
      PUSH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Tag from the inputs
        id: tag
        run: |
          set -euo pipefail
          # One tag per combination of this folder and the digests of the images it copies from.
          for ref in hayone/craft-mcp:latest hayone/photocraft:remote hayone/vectorcraft:remote \
                     hayone/lightcraft:remote hayone/filmcraft:remote hayone/effectcraft:remote \
                     codercom/code-server:latest caddy:2-alpine node:22-bookworm-slim; do
            echo "$ref $(docker buildx imagetools inspect "$ref" --format '{{json .Manifest.Digest}}')"
          done > /tmp/inputs
          cat /tmp/inputs
          echo "tag=$(cat /tmp/inputs craft-vscode/* craft-mcp/* | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub for the tag
        id: exists
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/namespaces/hayone/repositories/craft-vscode/tags/${{ steps.tag.outputs.tag }}")
          if [ "$code" = 200 ] && [ "${{ inputs.force }}" != "true" ] && [ "$GITHUB_EVENT_NAME" != push ] \
             && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE:${{ steps.tag.outputs.tag }} already published; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build for the test
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: craft-vscode/Dockerfile
          load: true
          platforms: linux/amd64
          tags: craft-vscode:test

      - name: Smoke test
        if: steps.exists.outputs.skip != 'true'
        run: bash craft-vscode/test.sh craft-vscode:test

      - name: Log in to Docker Hub
        if: steps.exists.outputs.skip != 'true' && env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push
        if: steps.exists.outputs.skip != 'true' && env.PUSH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: craft-vscode/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.title=craft-vscode
            org.opencontainers.image.description=VS Code in the browser with Claude Code and the storytold craft apps, ready to drive over MCP
            org.opencontainers.image.source=https://github.com/hayone1/Docker_Images
          tags: |
            ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE }}:latest
            hayone/craft-studio:${{ steps.tag.outputs.tag }}
            hayone/craft-studio:latest

      - name: Update Docker Hub description
        if: steps.exists.outputs.skip != 'true' && env.PUSH == 'true'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKER_PASSWORD }}
          repository: hayone/craft-vscode
          short-description: VS Code in the browser with Claude Code and the craft apps, in one container
          readme-filepath: craft-vscode/README.md
