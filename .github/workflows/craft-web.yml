name: Build storytold craft web images

# Every 3 hours, check each storytold/*craft repo for a new GitHub release. When the release's
# <app>-web-<version>.zip is not yet on Docker Hub as hayone/<app>:<version>, wrap it in nginx
# (craft-web/Dockerfile) and push it, The Docker Hub description is re-synced
# with the GitHub repo on every run, even when the build is skipped.
# The remote variant (<version>-remote, remote) adds craft-web/remote: photocraft, vectorcraft and
# lightcraft are rebuilt from source with patch.py, and every app gets the craft-remote.js relay
# client. craft-mcp is the matching MCP relay.

on:
  schedule:
    - cron: '17 */3 * * *'
  push:
    branches: [main]
    paths: ['craft-web/**', 'craft-mcp/**', '.github/workflows/craft-web.yml']
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if the release tag already exists on Docker Hub'
        required: false
        default: false
        type: boolean

concurrency:
  group: craft-web-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.app }} (${{ matrix.variant }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [photocraft, designcraft, vectorcraft, lightcraft, filmcraft, pdfcraft, effectcraft,
              figcraft, gridcraft, cadcraft, deckcraft, soundcraft, wordcraft]
        variant: [official, remote]
        exclude:
          - { app: designcraft, variant: remote }
          - { app: pdfcraft, variant: remote }
          # No craft-mcp support yet: official image only.
          - { app: figcraft, variant: remote }
          - { app: gridcraft, variant: remote }
          - { app: cadcraft, variant: remote }
          - { app: deckcraft, variant: remote }
          - { app: soundcraft, variant: remote }
          - { app: wordcraft, variant: remote }
    permissions:
      contents: read
      attestations: write
      id-token: write
    env:
      NAMESPACE: hayone
      APP: ${{ matrix.app }}
      SOURCE_REPO: storytold/${{ matrix.app }}
      GH_TOKEN: ${{ github.token }}
      SUFFIX: ${{ matrix.variant == 'remote' && '-remote' || '' }}
      FROM_SOURCE: ${{ matrix.variant == 'remote' && contains('photocraft vectorcraft lightcraft', matrix.app) }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Resolve latest release
        id: release
        run: |
          set -euo pipefail
          rel=$(gh api "repos/$SOURCE_REPO/releases/latest")
          tag=$(jq -r .tag_name <<<"$rel")
          version=${tag#v}
          zip_url=$(jq -r --arg n "$APP-web-$version.zip" '.assets[] | select(.name == $n) | .browser_download_url' <<<"$rel")
          if [ -z "$zip_url" ]; then
            echo "::error::Release $tag of $SOURCE_REPO has no $APP-web-$version.zip asset"
            exit 1
          fi
          repo=$(gh api "repos/$SOURCE_REPO")
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip_url=$zip_url" >> "$GITHUB_OUTPUT"
          echo "release_url=$(jq -r .html_url <<<"$rel")" >> "$GITHUB_OUTPUT"
          desc=$(jq -r '.description // empty' <<<"$repo")
          [ -n "$desc" ] || desc="${APP^} web app, served by nginx"
          # Docker Hub short descriptions are capped at 100 characters.
          echo "description=${desc:0:100}" >> "$GITHUB_OUTPUT"
          echo "homepage=$(jq -r '.homepage // empty' <<<"$repo")" >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub for existing tag
        id: exists
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/namespaces/$NAMESPACE/repositories/$APP/tags/${{ steps.release.outputs.version }}$SUFFIX")
          # A push changes the build itself, so it rebuilds the current release.
          if [ "$code" = 200 ] && [ "${{ inputs.force }}" != "true" ] && [ "$GITHUB_EVENT_NAME" != push ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "$NAMESPACE/$APP:${{ steps.release.outputs.version }}$SUFFIX already published; skipping build."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the app source
        if: steps.exists.outputs.skip != 'true' && env.FROM_SOURCE == 'true'
        uses: actions/checkout@v5
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ steps.release.outputs.tag }}
          path: src

      - name: Set up Rust
        if: steps.exists.outputs.skip != 'true' && env.FROM_SOURCE == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        if: steps.exists.outputs.skip != 'true' && env.FROM_SOURCE == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src
          key: ${{ matrix.app }}-web

      - name: Build patched web app
        if: steps.exists.outputs.skip != 'true' && env.FROM_SOURCE == 'true'
        working-directory: src
        run: |
          set -euo pipefail
          # The same tools as the app's own release workflow (web job).
          if [ "$APP" = lightcraft ]; then
            bindgen=$(grep -A1 '^name = "wasm-bindgen"$' Cargo.lock | sed -n 's/^version = "\(.*\)"$/\1/p')
            cargo install wasm-bindgen-cli --version "$bindgen" --locked
          else
            curl -fsSL https://github.com/trunk-rs/trunk/releases/download/v0.21.14/trunk-x86_64-unknown-linux-gnu.tar.gz \
              | tar -xz -C "$HOME/.cargo/bin" trunk
          fi
          python3 ../craft-web/remote/patch.py "$APP" .
          packaging/web/package.sh
          unzip -q "dist/release/$APP-web-${{ steps.release.outputs.version }}.zip" -d /tmp/web
          mv "/tmp/web/$APP-web-${{ steps.release.outputs.version }}" ../craft-web/site
          test -s ../craft-web/site/index.html

      - name: Download and unpack web release
        if: steps.exists.outputs.skip != 'true' && env.FROM_SOURCE != 'true'
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/web.zip "${{ steps.release.outputs.zip_url }}"
          unzip -q /tmp/web.zip -d /tmp/web
          # The zip holds a single <app>-web-<version>/ folder.
          mv "/tmp/web/$APP-web-${{ steps.release.outputs.version }}" craft-web/site
          test -s craft-web/site/index.html

      - name: Put the wasm-bindgen snippets next to the app's glue
        # photocraft 0.17 and 0.18 ship app/photocraft-web.js, which imports ./snippets/…, but
        # keep snippets/ only at the site root, so the page stays on "Loading PhotoCraft…"
        # (storytold/photocraft#10491). Copy them where the glue looks; a fixed release skips this.
        if: steps.exists.outputs.skip != 'true'
        run: |
          site=craft-web/site
          if [ -d "$site/app" ] && [ -d "$site/snippets" ] && [ ! -d "$site/app/snippets" ] \
            && grep -qs '\./snippets/' "$site"/app/*.js; then
            cp -R "$site/snippets" "$site/app/snippets"
            echo "Copied snippets/ into app/"
          fi

      - name: Add the relay client
        if: steps.exists.outputs.skip != 'true' && matrix.variant == 'remote'
        run: python3 craft-web/remote/inject.py "$APP" craft-web/site

      - name: Log in to Docker Hub
        if: steps.exists.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata (tags, labels) for Docker
        if: steps.exists.outputs.skip != 'true'
        id: meta
        uses: docker/metadata-action@9ec57ed1fcdbf14dcef7dfbe97b2010124a938b7
        with:
          images: ${{ env.NAMESPACE }}/${{ env.APP }}
          tags: |
            type=raw,value=${{ steps.release.outputs.version }}${{ env.SUFFIX }}
            type=raw,value=${{ matrix.variant == 'remote' && 'remote' || 'latest' }}
          labels: |
            org.opencontainers.image.title=${{ env.APP }}
            org.opencontainers.image.description=${{ steps.release.outputs.description }}
            org.opencontainers.image.source=https://github.com/${{ env.SOURCE_REPO }}
            org.opencontainers.image.url=${{ steps.release.outputs.homepage || format('https://github.com/{0}', env.SOURCE_REPO) }}
            org.opencontainers.image.version=${{ steps.release.outputs.version }}${{ env.SUFFIX }}
            org.opencontainers.image.licenses=MIT OR Apache-2.0

      - name: Build and push Docker image
        if: steps.exists.outputs.skip != 'true'
        id: push
        uses: docker/build-push-action@v6
        with:
          context: craft-web
          push: true
          # Static files only, so arm64 costs nothing extra.
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Generate artifact attestation
        if: steps.exists.outputs.skip != 'true'
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: index.docker.io/${{ env.NAMESPACE }}/${{ env.APP }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Write Docker Hub overview
        if: matrix.variant == 'official'
        run: |
          homepage="${{ steps.release.outputs.homepage }}"
          {
            echo "# $APP"
            echo
            echo "${{ steps.release.outputs.description }}"
            echo
            echo "- Source: https://github.com/$SOURCE_REPO"
            [ -n "$homepage" ] && echo "- Homepage: $homepage"
            echo "- Release: [${{ steps.release.outputs.tag }}](${{ steps.release.outputs.release_url }})"
            echo
            echo "Unofficial image: the upstream \`$APP-web-<version>.zip\` release asset served by nginx (non-root, port 8080)."
            echo
            echo '```sh'
            echo "docker run -d -p 8080:8080 $NAMESPACE/$APP:latest"
            echo '```'
            echo
            echo "Health check: \`GET /healthz\`. Tags: \`latest\` and the release version (e.g. \`${{ steps.release.outputs.version }}\`)."
            echo "The \`remote\` and \`<version>-remote\` tags add a relay client so an MCP client can drive the open tab through [craft-mcp](https://hub.docker.com/r/$NAMESPACE/craft-mcp)."
            echo "Licensed MIT OR Apache-2.0, as upstream."
          } > /tmp/README.md

      - name: Update Docker Hub description
        if: matrix.variant == 'official'
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          # Needs a Docker Hub access token with Read, Write & Delete scope; push-only tokens get 403.
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKER_PASSWORD }}
          repository: ${{ env.NAMESPACE }}/${{ env.APP }}
          short-description: ${{ steps.release.outputs.description }}
          readme-filepath: /tmp/README.md

  craft-mcp:
    name: craft-mcp
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v5

      - name: Resolve CLI versions
        id: versions
        run: |
          set -euo pipefail
          for app in photocraft vectorcraft lightcraft filmcraft effectcraft; do
            tag=$(gh api "repos/storytold/$app/releases/latest" -q .tag_name)
            echo "${app^^}_VERSION=${tag#v}" >> /tmp/build-args
          done
          # One tag per combination of CLI versions and relay source.
          echo "tag=$(cat /tmp/build-args craft-mcp/* | sha256sum | cut -c1-12)" >> "$GITHUB_OUTPUT"
          { echo 'build_args<<ARGS'; cat /tmp/build-args; echo ARGS; } >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub for existing tag
        id: exists
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            "https://hub.docker.com/v2/namespaces/hayone/repositories/craft-mcp/tags/${{ steps.versions.outputs.tag }}")
          if [ "$code" = 200 ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.exists.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: craft-mcp
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: ${{ steps.versions.outputs.build_args }}
          tags: |
            hayone/craft-mcp:${{ steps.versions.outputs.tag }}
            hayone/craft-mcp:latest

  craft-ai-hub:
    name: craft-ai-hub
    runs-on: ubuntu-latest
    steps:
      - name: Check out hayone1/craft-ai-hub
        uses: actions/checkout@v5
        with:
          repository: hayone1/craft-ai-hub

      - name: Tag from source
        id: version
        run: echo "tag=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Check Docker Hub for existing tag
        id: exists
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}'             "https://hub.docker.com/v2/namespaces/hayone/repositories/craft-ai-hub/tags/${{ steps.version.outputs.tag }}")
          if [ "$code" = 200 ] && [ "${{ inputs.force }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: steps.exists.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.exists.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        if: steps.exists.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          labels: |
            org.opencontainers.image.source=https://github.com/hayone1/craft-ai-hub
            org.opencontainers.image.revision=${{ steps.version.outputs.tag }}
          tags: |
            hayone/craft-ai-hub:${{ steps.version.outputs.tag }}
            hayone/craft-ai-hub:latest

      - name: Update Docker Hub description
        uses: peter-evans/dockerhub-description@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_DESCRIPTION_TOKEN || secrets.DOCKER_PASSWORD }}
          repository: hayone/craft-ai-hub
          short-description: Launcher, proxy and Claude Code assistant overlay for the storytold craft web apps
          readme-filepath: README.md
